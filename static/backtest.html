<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>策略回测 - QuantDesk</title>
<script src="/static/echarts.min.js"></script>
<style>
body{font:14px -apple-system,sans-serif;background:#080c12;color:#e2e8f0;margin:0;padding:24px}
.card{background:#0f1620;border:1px solid #1a2738;border-radius:10px;padding:18px;margin-bottom:14px}
h2{font-size:14px;margin:0 0 12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
nav{margin-bottom:20px}nav a{color:#4d9fff;margin-right:16px;text-decoration:none;font-size:13px}
.up{color:#26b74e}.down{color:#e55050}.muted{color:#64748b}
.btn{display:inline-block;padding:8px 18px;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}
.btn-p{background:#4d9fff;color:#fff}.btn-o{background:transparent;border:1px solid #1a2738;color:#e2e8f0;padding:6px 12px;font-size:11px}
.tag{display:inline-block;padding:4px 10px;border-radius:16px;font-size:11px;margin:2px;cursor:pointer;border:1px solid #1a2738;background:#080c12}.tag.on{background:rgba(77,159,255,.1);border-color:#4d9fff;color:#4d9fff}
.mc{background:#0f1620;border:1px solid #1a2738;border-radius:10px;padding:16px;text-align:center}.mc .v{font-size:22px;font-weight:800}.mc .l{font-size:10px;color:#64748b;margin-top:4px}
select,input{background:#080c12;border:1px solid #1a2738;color:#e2e8f0;padding:7px 10px;border-radius:7px;font-size:13px;width:100%}
label{font-size:11px;color:#64748b;display:block;margin-bottom:4px}input[type=range]{width:100%;accent-color:#4d9fff}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;padding:8px;border-bottom:2px solid #1a2738;color:#64748b;font-size:10px}td{padding:8px;border-bottom:1px solid #1a2738}
</style></head><body>
<nav><a href="/static/dash.html">📊 仪表盘</a><a href="/static/monitor.html">📡 行情</a><a href="/static/backtest.html">⚔️ 回测</a><a href="/">🏠 菜单</a></nav>
<div class="grid3">
<div class="card"><h2>选择股票 <span class="muted" style="font-size:11px;font-weight:400">已选 <b id="cnt">0</b></span></h2><div id="tags" style="max-height:200px;overflow-y:auto"></div><div style="margin-top:8px;display:flex;gap:6px"><button class="btn btn-o" onclick="sel('all')">全选</button><button class="btn btn-o" onclick="sel('top10')">TOP10</button><button class="btn btn-o" onclick="sel('clear')">清除</button></div></div>
<div class="card"><h2>策略参数</h2><label>策略</label><select id="sid" onchange="updateForm()"></select><div id="form" style="margin-top:8px"></div></div>
<div class="card"><h2>执行</h2><button class="btn btn-p" onclick="run()" style="width:100%">⚡ 开始回测</button><div id="status" style="margin-top:8px;font-size:12px;color:#64748b">选择股票和策略后开始</div></div></div>
<div id="result" style="display:none"><div class="grid4" id="metrics"></div>
<div class="grid2"><div class="card"><h2>收益曲线</h2><div style="width:100%;height:300px" id="c1"></div></div>
<div class="card"><h2>盈亏排行</h2><div style="width:100%;height:300px" id="c2"></div></div></div>
<div class="card"><h2>交易明细</h2><table id="tbl"></table></div></div>

<script>
var stocks=[],strats=[],selSet=new Set();
fetch('/api/stocks').then(r=>r.json()).then(d=>{stocks=d;renderTags()});
fetch('/api/strategies').then(r=>r.json()).then(d=>{strats=d;document.getElementById('sid').innerHTML=strats.filter(s=>s.id!=='custom').map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('');updateForm()});

function renderTags(){document.getElementById('tags').innerHTML=stocks.map(s=>'<span class="tag'+(selSet.has(s.code)?' on':'')+'" onclick="toggle(\''+s.code+'\')">'+s.name+'</span>').join('');document.getElementById('cnt').textContent=selSet.size}
function toggle(c){selSet.has(c)?selSet.delete(c):selSet.add(c);renderTags()}
function sel(a){if(a=='all')stocks.forEach(s=>selSet.add(s.code));else if(a=='top10'){selSet.clear();stocks.slice(0,10).forEach(s=>selSet.add(s.code))}else selSet.clear();renderTags()}

function updateForm(){var s=strats.find(x=>x.id==document.getElementById('sid').value);if(!s)return;var h='';Object.entries(s.param_meta||{}).forEach(([k,m])=>{var v=s.params[k];h+='<label>'+m.desc+' ('+v+')</label><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input type="range" min="'+m.min+'" max="'+m.max+'" step="'+(m.step||1)+'" value="'+v+'" oninput="this.nextElementSibling.textContent=this.value;document.getElementById(\'p-'+k+'\').value=this.value"><span style="font-size:11px;color:#4d9fff;font-weight:600;min-width:20px;text-align:right">'+v+'</span></div><input type="hidden" id="p-'+k+'" value="'+v+'">'});document.getElementById('form').innerHTML=h||'<span class="muted">无参数</span>'}

async function run(){
var codes=Array.from(selSet);if(!codes.length){alert('请选择股票');return}
var sid=document.getElementById('sid').value,params={};
// Collect params from both hidden inputs (range sliders) and textareas (custom strategy)
document.querySelectorAll('#form input[type=hidden]').forEach(function(e){
  var v=parseFloat(e.value);
  params[e.id.replace('p-','')]=isNaN(v)?e.value:v;
});
document.querySelectorAll('#form textarea').forEach(function(e){
  params[e.getAttribute('data-param')]=e.value.trim();
});
document.getElementById('status').innerHTML='<span style="color:#e8a838">⏳ 回测中...</span>';
var r=await fetch('/api/backtest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codes:codes,strategy:sid,params:params})});var d=await r.json();
if(d.error){alert(d.error);return}
document.getElementById('result').style.display='block';
document.getElementById('status').innerHTML='<span class="up">✓ 完成</span> '+d.total_trades+'笔交易';
document.getElementById('metrics').innerHTML='<div class="mc"><div class="v '+(d.total_pnl>=0?'up':'down')+'">'+(d.total_pnl/10000).toFixed(1)+'万</div><div class="l">总盈亏</div></div><div class="mc"><div class="v">'+d.avg_win_rate+'%</div><div class="l">胜率</div></div><div class="mc"><div class="v">'+(d.avg_sharpe||'-')+'</div><div class="l">Sharpe</div></div><div class="mc"><div class="v '+(d.max_dd>20?'down':'')+'">'+d.max_dd+'%</div><div class="l">最大回撤</div></div>';
document.getElementById('tbl').innerHTML='<thead><tr><th>股票</th><th>盈亏(万)</th><th>交易</th><th>胜率</th><th>Sharpe</th><th>回撤</th><th>盈亏比</th></tr></thead><tbody>'+d.results.map(r=>'<tr><td><b>'+r.code+'</b></td><td class="'+(r.pnl>=0?'up':'down')+'">'+(r.pnl/10000).toFixed(2)+'</td><td>'+r.trades+'</td><td>'+r.win_rate+'%</td><td>'+r.sharpe+'</td><td>'+r.max_drawdown+'%</td><td>'+r.profit_factor+'</td></tr>').join('')+'</tbody>';
setTimeout(function(){
var c1=echarts.init(document.getElementById('c1'));var cum=0,eq=[0];d.results.forEach(r=>{cum+=r.pnl;eq.push(cum)});
c1.setOption({tooltip:{},grid:{left:60,right:15,top:15,bottom:35},xAxis:{type:'category',data:['起始'].concat(d.results.map(r=>r.code)),axisLabel:{fontSize:10,color:'#64748b'}},yAxis:{axisLabel:{formatter:v=>(v/10000).toFixed(0)+'w',color:'#64748b'},splitLine:{lineStyle:{color:'#1a2738'}}},series:[{type:'line',data:eq,areaStyle:{color:'rgba(77,159,255,.08)'},lineStyle:{color:'#4d9fff',width:2},smooth:true,symbol:'none'}]});
var c2=echarts.init(document.getElementById('c2'));c2.setOption({tooltip:{},grid:{left:60,right:15,top:15,bottom:35},xAxis:{type:'category',data:d.results.map(r=>r.code),axisLabel:{fontSize:10,color:'#64748b'}},yAxis:{axisLabel:{formatter:v=>(v/10000).toFixed(0)+'w',color:'#64748b'},splitLine:{lineStyle:{color:'#1a2738'}}},series:[{type:'bar',data:d.results.map(r=>({value:r.pnl,itemStyle:{color:r.pnl>=0?'#26b74e':'#e55050'}})),barWidth:'60%'}]})},200)}
</script></body></html>
